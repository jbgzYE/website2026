<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internship Portfolio — Zixuan Wang</title>
  <style>
    :root {
      --page-bg: #f3f3f0;
      --text: #101010;
      --muted: #777771;
      --line: rgba(16, 16, 16, 0.13);
    }

    * { box-sizing: border-box; }

    html { background: var(--page-bg); }

    body {
      min-width: 320px;
      margin: 0;
      overflow-x: hidden;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 18px;
    }

    button, video { font: inherit; }

    .navbar {
      position: relative;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 60px;
      border-bottom: 1px solid var(--line);
    }

    .nav-left a,
    .nav-right a {
      color: inherit;
      text-decoration: none;
    }

    .nav-left a {
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -0.03em;
      transition: opacity 0.25s ease;
    }

    .nav-left a:hover { opacity: 0.55; }

    .nav-right {
      display: flex;
      gap: 32px;
    }

    .nav-right a {
      color: #555;
      font-size: 20px;
      transition: color 0.25s ease;
    }

    .nav-right a:hover { color: #000; }

    main {
      display: flex;
      min-height: calc(100svh - 104px);
      flex-direction: column;
      padding: 42px 0 44px;
    }

    .project-header {
      display: flex;
      width: min(1500px, calc(100% - 120px));
      margin: 0 auto;
      justify-content: flex-start;
      align-items: baseline;
      gap: 30px;
    }

    .project-type {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .carousel {
      position: relative;
      display: flex;
      min-height: 500px;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      margin-top: 8px;
      outline: none;
      perspective: 1500px;
      perspective-origin: center 45%;
      touch-action: pan-y;
      user-select: none;
    }

    .carousel-stage {
      position: relative;
      width: 100%;
      height: clamp(390px, 49vw, 650px);
      transform-style: preserve-3d;
    }

    .slide {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 0;
      width: min(64vw, 980px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: #050505;
      box-shadow: 0 22px 65px rgba(0, 0, 0, 0.16);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.45);
      transition: transform 700ms cubic-bezier(0.2, 0.72, 0.18, 1),
                  opacity 500ms ease,
                  filter 500ms ease;
      will-change: transform, opacity;
    }

    .slide video {
      display: block;
      width: 100%;
      height: 100%;
      background: #050505;
      object-fit: contain;
    }

    .slide::after {
      position: absolute;
      inset: 0;
      content: "";
      background: rgba(0, 0, 0, 0.22);
      pointer-events: none;
      transition: opacity 500ms ease;
    }

    .slide[data-offset="0"] {
      z-index: 5;
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) translateZ(120px) scale(1);
    }

    .slide[data-offset="0"]::after { opacity: 0; }

    .slide[data-offset="-1"],
    .slide[data-offset="1"] {
      z-index: 3;
      opacity: 0.68;
      pointer-events: auto;
      cursor: pointer;
      filter: saturate(0.72) brightness(0.82);
    }

    .slide[data-offset="-1"] {
      transform: translate(-50%, -50%) translateX(-66%) rotateY(38deg) scale(0.73);
    }

    .slide[data-offset="1"] {
      transform: translate(-50%, -50%) translateX(66%) rotateY(-38deg) scale(0.73);
    }

    .slide[data-offset="-2"],
    .slide[data-offset="2"] {
      z-index: 1;
      opacity: 0.18;
      pointer-events: auto;
      cursor: pointer;
      filter: saturate(0.3) brightness(0.58);
    }

    .slide[data-offset="-2"] {
      transform: translate(-50%, -50%) translateX(-105%) rotateY(46deg) scale(0.5);
    }

    .slide[data-offset="2"] {
      transform: translate(-50%, -50%) translateX(105%) rotateY(-46deg) scale(0.5);
    }

    .carousel-control {
      position: absolute;
      top: 50%;
      z-index: 20;
      display: grid;
      width: 54px;
      height: 54px;
      padding: 0;
      place-items: center;
      appearance: none;
      -webkit-appearance: none;
      border: 0 !important;
      border-radius: 0;
      outline: 0;
      background: transparent !important;
      box-shadow: none !important;
      color: #000;
      cursor: pointer;
      font-size: 32px;
      line-height: 1;
      opacity: 1;
      transform: translateY(-50%);
      transition: transform 0.35s cubic-bezier(0.2, 0.75, 0.2, 1);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      -webkit-tap-highlight-color: transparent;
    }

    .carousel-control:hover,
    .carousel-control:focus,
    .carousel-control:focus-visible,
    .carousel-control:active {
      border: 0 !important;
      outline: 0;
      background: transparent !important;
      box-shadow: none !important;
      color: #000;
    }

    .carousel-control:hover {
      transform: translateY(-50%) scale(1.12);
    }

    .carousel-control.prev { left: max(22px, 4vw); }
    .carousel-control.next { right: max(22px, 4vw); }

    .carousel-footer {
      display: grid;
      width: min(980px, calc(100% - 120px));
      margin: -4px auto 0;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 26px;
    }

    .video-info { min-width: 0; }

    .video-title {
      margin: 0;
      overflow: hidden;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .video-role {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 7px;
      height: 7px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #b8b8b2;
      cursor: pointer;
      transition: width 300ms ease, border-radius 300ms ease, background 300ms ease;
    }

    .dot.active {
      width: 24px;
      border-radius: 5px;
      background: #111;
    }

    .counter {
      justify-self: end;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
    }

    @media (max-width: 768px) {
      .navbar { padding: 24px; }
      .nav-left a { font-size: 30px; }
      .nav-right { gap: 18px; }
      .nav-right a { font-size: 17px; }

      main {
        min-height: calc(100svh - 83px);
        padding: 30px 0 34px;
      }

      .project-header {
        width: calc(100% - 48px);
        align-items: flex-end;
      }

      .project-type {
        font-size: 14px;
        text-align: left;
      }

      .carousel { min-height: 390px; }

      .carousel-stage {
        height: clamp(300px, 92vw, 430px);
      }

      .slide {
        width: 84vw;
        border-radius: 5px;
      }

      .slide[data-offset="-1"] {
        transform: translate(-50%, -50%) translateX(-57%) rotateY(34deg) scale(0.72);
      }

      .slide[data-offset="1"] {
        transform: translate(-50%, -50%) translateX(57%) rotateY(-34deg) scale(0.72);
      }

      .slide[data-offset="-2"],
      .slide[data-offset="2"] {
        opacity: 0;
        pointer-events: none;
      }

      .carousel-control {
        top: auto;
        bottom: 7px;
        width: 42px;
        height: 42px;
        font-size: 22px;
        transform: none;
      }

      .carousel-control:hover { transform: scale(1.1); }
      .carousel-control.prev { left: 24px; }
      .carousel-control.next { right: 24px; }

      .carousel-footer {
        width: calc(100% - 48px);
        margin-top: 0;
        grid-template-columns: 1fr auto;
      }

      .dots { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide, .carousel-control, .dot {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <a href="../index.html">Zixuan Wang</a>
    </div>
    <nav class="nav-right" aria-label="Primary navigation">
      <a href="../work.html">work</a>
      <a href="../about.html">about</a>
    </nav>
  </header>

  <main>
    <div class="project-header">
      <p class="project-type">Internship Portfolio</p>
    </div>

    <section class="carousel" id="carousel" aria-label="实习视频作品轮播" tabindex="0">
      <div class="carousel-stage" id="carousel-stage"></div>
      <button class="carousel-control prev" type="button" aria-label="上一个视频">&#8592;</button>
      <button class="carousel-control next" type="button" aria-label="下一个视频">&#8594;</button>

      <div class="carousel-footer">
        <div class="video-info" aria-live="polite">
          <p class="video-title" id="video-title"></p>
          <p class="video-role" id="video-role"></p>
        </div>
        <div class="dots" id="dots" aria-label="选择视频"></div>
        <div class="counter"><span id="current-number">01</span> / 10</div>
      </div>
    </section>
  </main>

  <script>
    const projects = [
      { title: '个人项目：摧毁相机', role: '视频论文', src: '../作业帮作品集/00 个人项目-摧毁相机 视频论文_1080p.mp4' },
      { title: '产品广告', role: '出镜', src: '../作业帮作品集/01产品广告 出镜_1080p.mp4' },
      { title: '目标管理宣传片', role: '拍摄 · 剪辑', src: '../作业帮作品集/02目标管理宣传片拍摄:剪辑_1080p.mp4' },
      { title: '外教直播课宣传', role: '拍摄 · 剪辑', src: '../作业帮作品集/03外教直播课宣传 拍摄:剪辑_1080p.mp4' },
      { title: '微电影预告片', role: '剪辑 · 英文字幕翻译', src: '../作业帮作品集/04微电影预告片 剪辑:英文字幕翻译_1080p.mp4' },
      { title: '视频课短视频', role: '拍摄 · 剪辑', src: '../作业帮作品集/05视频课短视频拍摄:剪辑_1080p.mp4' },
      { title: '家庭教育课', role: '拍摄 · 剪辑', src: '../作业帮作品集/06家庭教育课拍摄:剪辑_1080p.mp4' },
      { title: '视频课短视频', role: '拍摄 · 剪辑', src: '../作业帮作品集/07视频课短视频 拍摄:剪辑_1080p.mp4' },
      { title: '授课技巧培训', role: '拍摄 · 剪辑', src: '../作业帮作品集/08授课技巧培训拍摄:剪辑_1080p.mp4' },
      { title: '家庭教育课', role: '拍摄 · 剪辑', src: '../作业帮作品集/09家庭教育课拍摄:剪辑_1080p.mp4' }
    ];

    const carousel = document.getElementById('carousel');
    const stage = document.getElementById('carousel-stage');
    const dotsContainer = document.getElementById('dots');
    const titleElement = document.getElementById('video-title');
    const roleElement = document.getElementById('video-role');
    const counterElement = document.getElementById('current-number');
    const previousButton = document.querySelector('.carousel-control.prev');
    const nextButton = document.querySelector('.carousel-control.next');
    let activeIndex = 0;
    let pointerStartX = null;

    const slides = projects.map((project, index) => {
      const slide = document.createElement('article');
      const video = document.createElement('video');
      slide.className = 'slide';
      slide.dataset.index = index;
      slide.setAttribute('aria-label', project.title);
      video.src = project.src;
      video.preload = 'metadata';
      video.playsInline = true;
      video.muted = true;
      video.setAttribute('muted', '');
      video.setAttribute('aria-label', project.title);
      slide.appendChild(video);
      stage.appendChild(slide);

      slide.addEventListener('click', (event) => {
        if (index !== activeIndex) {
          event.preventDefault();
          goTo(index);
        }
      });
      return slide;
    });

    const dots = projects.map((project, index) => {
      const dot = document.createElement('button');
      dot.className = 'dot';
      dot.type = 'button';
      dot.setAttribute('aria-label', '查看' + project.title);
      dot.addEventListener('click', () => goTo(index));
      dotsContainer.appendChild(dot);
      return dot;
    });

    function shortestOffset(index) {
      let offset = index - activeIndex;
      const midpoint = projects.length / 2;
      if (offset > midpoint) offset -= projects.length;
      if (offset < -midpoint) offset += projects.length;
      return offset;
    }

    function updateCarousel() {
      slides.forEach((slide, index) => {
        const offset = shortestOffset(index);
        const video = slide.querySelector('video');
        const isActive = index === activeIndex;
        slide.dataset.offset = Math.abs(offset) <= 2 ? offset : 'hidden';
        slide.setAttribute('aria-hidden', String(!isActive));
        video.controls = isActive;
        video.tabIndex = isActive ? 0 : -1;

        if (isActive) {
          video.muted = true;
          const playback = video.play();
          if (playback) playback.catch(() => {});
        } else {
          video.pause();
          video.muted = true;
        }
      });

      dots.forEach((dot, index) => {
        const isActive = index === activeIndex;
        dot.classList.toggle('active', isActive);
        dot.setAttribute('aria-current', isActive ? 'true' : 'false');
      });

      titleElement.textContent = projects[activeIndex].title;
      roleElement.textContent = projects[activeIndex].role;
      counterElement.textContent = String(activeIndex + 1).padStart(2, '0');
    }

    function goTo(index) {
      activeIndex = (index + projects.length) % projects.length;
      updateCarousel();
    }

    function showPrevious() { goTo(activeIndex - 1); }
    function showNext() { goTo(activeIndex + 1); }

    previousButton.addEventListener('click', showPrevious);
    nextButton.addEventListener('click', showNext);

    carousel.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        showPrevious();
      }
      if (event.key === 'ArrowRight') {
        event.preventDefault();
        showNext();
      }
    });

    carousel.addEventListener('pointerdown', (event) => {
      if (event.target.closest('video[controls]')) return;
      pointerStartX = event.clientX;
    });

    carousel.addEventListener('pointerup', (event) => {
      if (pointerStartX === null) return;
      const distance = event.clientX - pointerStartX;
      pointerStartX = null;
      if (Math.abs(distance) < 45) return;
      if (distance > 0) showPrevious();
      else showNext();
    });

    carousel.addEventListener('pointercancel', () => {
      pointerStartX = null;
    });

    document.addEventListener('visibilitychange', () => {
      const activeVideo = slides[activeIndex].querySelector('video');
      if (document.hidden) {
        activeVideo.pause();
      } else {
        activeVideo.muted = true;
        const playback = activeVideo.play();
        if (playback) playback.catch(() => {});
      }
    });

    document.addEventListener('click', (event) => {
      const link = event.target.closest('a');
      if (!link) return;
      const href = link.getAttribute('href');
      if (href && !href.includes('://') && !href.includes('.') && !href.startsWith('#') && !href.startsWith('mailto:')) {
        event.preventDefault();
        window.location.href = href + '.html';
      }
    });

    updateCarousel();
  </script>
</body>
</html>
